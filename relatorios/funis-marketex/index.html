<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funis da Marketex</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--roxo:#7C3AED;--roxo2:#A78BFA;--dark:#0F0B1E;--bg:#F5F3FA;--txt:#1F1A2E;--muted:#5F5876;--line:#E6E1F0;
 --q:#7C3AED;--m:#059669;--n:#EA580C;--a:#DB2777;--ok:#15803D;--okb:#DCFCE7;--wa:#B45309;--wab:#FEF3C7;--no:#B91C1C;--nob:#FEE2E2;--qu:#1D4ED8;--qub:#DBEAFE}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,system-ui,sans-serif;color:var(--txt);background:var(--bg);font-size:14px;line-height:1.5}
a{color:var(--roxo)}
.wrap{max-width:1320px;margin:0 auto;padding:0 24px}
.hero{background:var(--dark);color:#fff;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:24px 24px;padding:22px 0 18px}
.hero small{color:var(--roxo2);font-weight:600;letter-spacing:.6px;text-transform:uppercase;font-size:12px}
.hero h1{margin:2px 0 0;font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.5px}.hero h1 span{color:var(--roxo2)}
.tabs{background:var(--bg);border-bottom:1px solid var(--line);padding:12px 0}
.tabs .wrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs button{border:1px solid var(--line);background:#fff;font:600 14px Poppins;color:var(--txt);padding:8px 14px;border-radius:10px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--roxo);border-color:var(--roxo);color:#fff}
.tabs button small{font-weight:500;opacity:.75;margin-left:6px}
.leg{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;margin-left:auto}
.st{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.st.ok{background:var(--okb);color:var(--ok)}.st.wa{background:var(--wab);color:var(--wa)}.st.no{background:var(--nob);color:var(--no)}.st.qu{background:var(--qub);color:var(--qu)}
.intro{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin:18px 0 10px}
.intro h2{margin:0;font-size:21px;font-weight:700}.intro p{margin:2px 0 0;color:var(--muted);max-width:90ch}
.hint{font-size:12.5px;color:var(--muted)}
/* mapa */
.map{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 16px 14px}
@media(max-width:1260px){.map{overflow-x:auto}}
.grid{display:grid;grid-template-columns:auto 56px auto;align-items:center;min-width:1160px}
.tronco{display:flex;align-items:center}
.lanes{display:flex;flex-direction:column;gap:12px}
.lane{display:flex;align-items:center;gap:0;border-radius:14px;padding:8px 10px 8px 0;background:linear-gradient(90deg,var(--lb) 0,transparent 92%)}
.lane .ln{width:92px;flex:0 0 92px;padding:0 6px 0 10px;font-size:12px;line-height:1.25;color:var(--muted)}
.lane .ln b{display:block;font-size:13.5px;color:var(--c)}
.node{all:unset;box-sizing:border-box;cursor:pointer;width:93px;flex:0 0 93px;text-align:center;position:relative;padding:6px 4px;border-radius:12px}
.node:hover,.node:focus-visible{background:#F6F3FD}.node:focus-visible{outline:2px solid var(--roxo2)}
.node[aria-expanded=true]{background:#EFE9FD;box-shadow:inset 0 0 0 2px var(--c)}
.node .b{width:38px;height:38px;border-radius:50%;margin:0 auto 5px;display:grid;place-items:center;color:#fff;font-weight:800;background:var(--c);position:relative}
.node .b i{position:absolute;right:-6px;top:-5px;width:18px;height:18px;border-radius:50%;font-style:normal;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid #fff}
.node .b i.ok{background:var(--ok);color:#fff}.node .b i.wa{background:#F59E0B;color:#fff}.node .b i.no{background:var(--no);color:#fff}.node .b i.qu{background:var(--qu);color:#fff}
.node .t{display:block;font-weight:600;font-size:12.5px;line-height:1.2}.node .w{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.link{flex:0 0 8px;height:3px;background:var(--line);margin-top:-30px}
.fork svg{display:block;width:56px;height:100%}
.tip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:230px;background:var(--dark);color:#fff;border-radius:10px;padding:9px 11px;font-size:12px;line-height:1.4;text-align:left;opacity:0;visibility:hidden;transition:opacity .12s;pointer-events:none;z-index:5;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.tip::after{content:'';position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--dark)}
.tip em{display:block;font-style:normal;color:var(--roxo2);margin-top:5px}
.node:hover .tip,.node:focus-visible .tip{opacity:1;visibility:visible}
/* painel */
.panel{background:#fff;border:1px solid var(--line);border-top:4px solid var(--c,var(--roxo));border-radius:16px;margin-top:12px;padding:16px 18px;display:grid;grid-template-columns:1fr 1.15fr;gap:18px}
.panel h3{margin:0;font-size:18px}.panel .tag{font-size:12px;font-weight:600;color:var(--c)}
.panel p{margin:6px 0 0}.panel ul{margin:8px 0 0;padding-left:18px}.panel li{margin:2px 0}
.trk{background:#FAF9FD;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.trk .h{font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.trk .row{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line)}.trk .row:nth-child(2){border-top:0}
.trk .tool{font-weight:700;min-width:126px}.trk .d{flex:1}
.close{all:unset;cursor:pointer;color:var(--muted);font-size:12.5px;justify-self:end;grid-column:1/-1;margin-top:-6px}
/* blocos recolhidos */
details{background:#fff;border:1px solid var(--line);border-radius:14px;margin-top:12px}
summary{cursor:pointer;padding:13px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}summary::after{content:'+';font-size:20px;color:var(--roxo)}details[open] summary::after{content:'–'}
summary small{font-weight:500;color:var(--muted);margin-left:8px}
.dbody{padding:0 16px 16px}
table{width:100%;border-collapse:collapse}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:600}tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.gaps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gaps li{border:1px solid var(--line);border-radius:12px;padding:10px 12px}.gaps b{display:block}.gaps span{color:var(--muted);font-size:13px}
.empty{background:#fff;border:1px dashed var(--roxo2);border-radius:16px;padding:22px;color:var(--muted)}
.foot{color:var(--muted);font-size:12.5px;padding:20px 0 36px}
/* celular: vira lista */
@media(max-width:820px){
 .wrap{padding:0 16px}.hero h1{font-size:23px}.leg{margin-left:0}
 .map{padding:10px}.grid{display:block;min-width:0}.tronco,.lane{flex-direction:column;align-items:stretch;background:none;padding:0}
 .fork,.link{display:none}.lane{margin-top:10px;border-top:3px solid var(--c);padding-top:6px}.lane .ln{width:auto;padding:4px 6px}
 .node{width:auto;flex:none;display:grid;grid-template-columns:44px 1fr;text-align:left;align-items:center;gap:0 6px}
 .node .b{grid-row:span 2;margin:0}.tip{display:none}
 .panel{grid-template-columns:1fr}.gaps{grid-template-columns:1fr}.trk .tool{min-width:96px}}
</style>
</head>
<body>

<script>
/* Situação: ok = funciona · wa = parcial · qu = a confirmar · no = não existe. A bolinha da etapa mostra a pior situação dela. */
const ST={ok:['✓','funciona'],wa:['!','parcial'],qu:['?','confirmar'],no:['✕','não existe']}, ORD=['no','qu','wa','ok'];
const FUNIS=[
{id:'mapeamento', nome:'Quiz do Mapeamento', status:'mapeado em 26/11/26',

 lanes:[{n:'Mapeamento',w:'fatura R$ 5 mil ou mais',c:'var(--m)',lb:'#ECFDF5',e:['video','agendar','whats','qualif','call','venda']},
        {n:'MNIA',w:'fatura até R$ 5 mil',c:'var(--n)',lb:'#FFF7ED',e:['mnia1','mnia2']},

 },
 tabela:[
  ['Meta Ads','gasto, impressões, cliques, visitas, conversões','relatórios (puxados direto)','na hora de atualizar','wa'],

{id:'workshop', nome:'Quiz do Especialista com IA', status:'a mapear', resumo:'Quiz do inLead (funil 144264) que vende o ingresso do Workshop (LS). Os leads ficam na planilha unificada do LS, aba "INLEAD | LEADS".'},

const $=s=>document.querySelector(s);
const pill=k=>`<span class="st ${k}">${ST[k][0]} ${ST[k][1]}</span>`;
const pior=e=>ORD.find(s=>e.k.some(x=>x[2]===s));
let F=null, ABERTO=null, NUM={};
function node(id,c){const e=F.E[id],s=pior(e);
 return `<button class="node" data-id="${id}" style="--c:${c}" aria-expanded="${ABERTO===id}"><span class="b">${NUM[id]}<i class="${s}">${ST[s][0]}</i></span><span class="t">${e.t}</span><span class="w">${e.w}</span>

 const f=F;
 if(!f.E){$('#main').innerHTML=`<div class="intro"><div><h2>${f.nome}</h2><p>${f.resumo}</p></div></div><div class="empty">Este funil ainda não foi mapeado. Para preencher, leve este documento para o chat do funil e peça para preencher a aba no mesmo formato do Quiz do Mapeamento.</div>`;return}
 NUM={};let n=0;f.tronco.forEach(id=>NUM[id]=++n);f.lanes.forEach(l=>l.e.forEach(id=>NUM[id]=++n));

 const ln=f.lanes.map(l=>`<div class="lane" style="--c:${l.c};--lb:${l.lb}"><div class="ln"><b>${l.n}</b>${l.w}</div>${l.e.map(id=>node(id,l.c)).join('<span class="link"></span>')}</div>`).join('');
 const fork=`<div class="fork"><svg viewBox="0 0 56 100" preserveAspectRatio="none" aria-hidden="true"><path d="M0,50 C30,50 26,17 56,17 M0,50 L56,50 M0,50 C30,50 26,83 56,83" fill="none" stroke="#D9D2EA" stroke-width="3" vector-effect="non-scaling-stroke"/></svg></div>`;
 $('#main').innerHTML=`<div class="intro"><div><h2>${f.nome}</h2><p>${f.resumo}</p></div><span class="hint">Passe o mouse para uma dica · clique na etapa para abrir os detalhes</span></div>

 <details><summary>Para onde vão os dados<small>${f.tabela.length} ferramentas</small></summary><div class="dbody tw"><table><thead><tr><th>Ferramenta</th><th>O que registra</th><th>Para onde vai</th><th>Como</th><th>Situação</th></tr></thead><tbody>${f.tabela.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${pill(r[4])}</td></tr>`).join('')}</tbody></table></div></details>
 <details><summary>O que falta definir<small>${f.gaps.length} pontos</small></summary><div class="dbody"><ul class="gaps">${f.gaps.map(g=>`<li><b>${g[0]}</b><span>${g[1]}</span></li>`).join('')}</ul></div></details>
 <details><summary>Relatórios deste funil<small>${f.links.length} links</small></summary><div class="dbody">${f.links.map(l=>`<a href="${l[1]}">${l[0]}</a>`).join(' · ')}</div></details>`;
 document.querySelectorAll('.node').forEach(b=>b.onclick=()=>abrir(b.dataset.id===ABERTO?null:b.dataset.id));
 painel();
}
function painel(){
 document.querySelectorAll('.node').forEach(b=>b.setAttribute('aria-expanded',b.dataset.id===ABERTO));
 const p=$('#panel');if(!ABERTO){p.innerHTML='';return}
 const e=F.E[ABERTO], b=document.querySelector(`.node[data-id="${ABERTO}"]`), c=b.style.getPropertyValue('--c');
 p.innerHTML=`<div class="panel" style="--c:${c}"><div><span class="tag">Etapa ${NUM[ABERTO]} · ${e.w}</span><h3>${e.t}</h3><p>${e.o}</p><ul>${e.m.map(x=>`<li>${x}</li>`).join('')}</ul></div>
  <div class="trk"><div class="h">Onde medimos</div>${e.k.map(k=>`<div class="row"><span class="tool">${k[0]}</span><span class="d">${k[1]}</span>${pill(k[2])}</div>`).join('')}</div>
  <button class="close" aria-label="Fechar detalhes">fechar ✕</button></div>`;
 p.querySelector('.close').onclick=()=>abrir(null);
}
function abrir(id){ABERTO=id;painel();if(id&&innerWidth<820)$('#panel').scrollIntoView({behavior:'smooth',block:'nearest'})}
function show(id,push){F=FUNIS.find(x=>x.id===id)||FUNIS[0];ABERTO=F.E?F.tronco[0]:null;document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===F.id));render();if(push)history.replaceState(null,'','#'+F.id)}
$('#tabs').innerHTML=FUNIS.map(f=>`<button data-id="${f.id}">${f.nome}<small>${f.status}</small></button>`).join('')+`<span class="leg">${Object.keys(ST).map(pill).join('')}</span>`;
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>show(b.dataset.id,true));
addEventListener('keydown',e=>{if(e.key==='Escape'&&ABERTO)abrir(null)});
addEventListener('hashchange',()=>show(location.hash.slice(1)));show(location.hash.slice(1));
</script>
